{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Auction Ethiopia LMS</title>
  <link rel="icon" type="image/png" href="{% static 'img/orange.png' %}">
  <link rel="shortcut icon" type="image/png" href="{% static 'img/orange.png' %}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="{% static 'css/login.css' %}?v=2" rel="stylesheet">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <img src="{% static 'img/logo.png' %}" alt="Auction Ethiopia Logo" class="login-logo">
      <h1>Auction Ethiopia</h1>
      <p>Letter Management System</p>
    </div>

    {% if form.errors %}
    <div class="alert alert-danger py-2">
      <small>Invalid username or password. Please try again.</small>
    </div>
    {% endif %}

    {% if messages %}
    {% for message in messages %}
    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} py-2">
      <small>{{ message }}</small>
    </div>
    {% endfor %}
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label for="id_username" class="form-label">Username</label>
        <input type="text" name="username" id="id_username" class="form-control"
               placeholder="Enter your username" autofocus required>
      </div>
      <div class="mb-4">
        <label for="id_password" class="form-label">Password</label>
        <input type="password" name="password" id="id_password" class="form-control"
               placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn btn-login">
        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
      </button>
    </form>

    <a href="{% url 'accounts:password_reset_request' %}" style="display:block; text-align:center; margin-top:1rem; color:rgba(255,255,255,0.5); font-size:0.85rem; text-decoration:none; transition:color 0.2s;"
       onmouseover="this.style.color='#d4a843'" onmouseout="this.style.color='rgba(255,255,255,0.5)'">
      <i class="bi bi-key me-1"></i>Forgot Password?
    </a>
  </div>
</body>
</html>
