{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Password | Auction Ethiopia LMS</title>
  <link rel="icon" type="image/png" href="{% static 'img/orange.png' %}">
  <link rel="shortcut icon" type="image/png" href="{% static 'img/orange.png' %}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="{% static 'css/login.css' %}?v=2" rel="stylesheet">
  <style>
    .step-indicator {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .step-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      transition: all 0.3s;
    }
    .step-dot.active {
      background: #d4a843;
      box-shadow: 0 0 8px rgba(212,168,67,0.4);
      transform: scale(1.2);
    }
    .step-dot.completed {
      background: #4ade80;
    }
    .reset-subtitle {
      color: rgba(255,255,255,0.55);
      font-size: 0.85rem;
      text-align: center;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.25rem;
      color: rgba(255,255,255,0.5);
      font-size: 0.85rem;
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: #d4a843; }
    .password-toggle {
      position: absolute;
      right: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: rgba(255,255,255,0.4);
      cursor: pointer;
      padding: 0;
      font-size: 1.1rem;
      transition: color 0.2s;
    }
    .password-toggle:hover { color: #d4a843; }
    .strength-bar {
      height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,0.1);
      margin-top: 0.5rem;
      overflow: hidden;
    }
    .strength-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.3s, background-color 0.3s;
      width: 0%;
    }
    .strength-text {
      font-size: 0.75rem;
      margin-top: 0.25rem;
      transition: color 0.3s;
    }
    .verified-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(74,222,128,0.1);
      border: 1px solid rgba(74,222,128,0.25);
      border-radius: 8px;
      padding: 0.35rem 0.75rem;
      margin-bottom: 0.75rem;
      font-size: 0.8rem;
      color: #4ade80;
      font-weight: 600;
    }
  </style>
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <img src="{% static 'img/logo.png' %}" alt="Auction Ethiopia Logo" class="login-logo">
      <h1>New Password</h1>
      <p>Letter Management System</p>
    </div>

    <div class="step-indicator">
      <div class="step-dot completed"></div>
      <div class="step-dot completed"></div>
      <div class="step-dot active"></div>
    </div>

    <div class="text-center mb-3">
      <div class="verified-badge">
        <i class="bi bi-check-circle-fill"></i> Identity Verified
      </div>
    </div>

    <p class="reset-subtitle">
      Choose a new password for your account
    </p>

    {% if messages %}
    {% for message in messages %}
    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} py-2">
      <small>{{ message }}</small>
    </div>
    {% endfor %}
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label for="id_password1" class="form-label">New Password</label>
        <div class="position-relative">
          <input type="password" name="password1" id="id_password1" class="form-control"
                 placeholder="Enter new password" required
                 style="padding-left: 2.5rem; padding-right: 2.5rem;">
          <i class="bi bi-lock" style="position:absolute; left:0.85rem; top:50%; transform:translateY(-50%); color:rgba(255,255,255,0.35);"></i>
          <button type="button" class="password-toggle" onclick="togglePassword('id_password1', this)">
            <i class="bi bi-eye"></i>
          </button>
        </div>
        <div class="strength-bar">
          <div class="strength-fill" id="strengthFill"></div>
        </div>
        <div class="strength-text" id="strengthText" style="color: rgba(255,255,255,0.4);">&nbsp;</div>
      </div>

      <div class="mb-4">
        <label for="id_password2" class="form-label">Confirm Password</label>
        <div class="position-relative">
          <input type="password" name="password2" id="id_password2" class="form-control"
                 placeholder="Confirm new password" required
                 style="padding-left: 2.5rem; padding-right: 2.5rem;">
          <i class="bi bi-lock-fill" style="position:absolute; left:0.85rem; top:50%; transform:translateY(-50%); color:rgba(255,255,255,0.35);"></i>
          <button type="button" class="password-toggle" onclick="togglePassword('id_password2', this)">
            <i class="bi bi-eye"></i>
          </button>
        </div>
        <div id="matchText" class="strength-text" style="color: rgba(255,255,255,0.4);">&nbsp;</div>
      </div>

      <button type="submit" class="btn btn-login" id="submitBtn">
        <i class="bi bi-check-lg me-2"></i>Reset Password
      </button>
    </form>

    <a href="{% url 'accounts:login' %}" class="back-link">
      <i class="bi bi-arrow-left me-1"></i>Back to Sign In
    </a>
  </div>

  <script>
    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'bi bi-eye';
      }
    }

    // Password strength indicator
    const pw1 = document.getElementById('id_password1');
    const pw2 = document.getElementById('id_password2');
    const fill = document.getElementById('strengthFill');
    const stxt = document.getElementById('strengthText');
    const mtxt = document.getElementById('matchText');

    pw1.addEventListener('input', () => {
      const val = pw1.value;
      let score = 0;
      if (val.length >= 8) score++;
      if (val.length >= 12) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;

      const levels = [
        { w: '0%', c: 'rgba(255,255,255,0.1)', t: '', tc: 'rgba(255,255,255,0.4)' },
        { w: '20%', c: '#ef4444', t: 'Very weak', tc: '#ef4444' },
        { w: '40%', c: '#f97316', t: 'Weak', tc: '#f97316' },
        { w: '60%', c: '#eab308', t: 'Fair', tc: '#eab308' },
        { w: '80%', c: '#22c55e', t: 'Strong', tc: '#22c55e' },
        { w: '100%', c: '#4ade80', t: 'Very strong', tc: '#4ade80' },
      ];
      const lv = levels[score];
      fill.style.width = lv.w;
      fill.style.backgroundColor = lv.c;
      stxt.textContent = lv.t || '\u00a0';
      stxt.style.color = lv.tc;

      checkMatch();
    });

    pw2.addEventListener('input', checkMatch);

    function checkMatch() {
      if (!pw2.value) { mtxt.innerHTML = '&nbsp;'; return; }
      if (pw1.value === pw2.value) {
        mtxt.textContent = '✓ Passwords match';
        mtxt.style.color = '#4ade80';
      } else {
        mtxt.textContent = '✗ Passwords do not match';
        mtxt.style.color = '#ef4444';
      }
    }
  </script>
</body>
</html>
